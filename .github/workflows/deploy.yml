name: wechat_crawler

on:
  schedule:
    # 北京时间每天 8:00 运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  crawl-and-commit:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install aiohttp beautifulsoup4 lxml

      - name: Run Keyword Crawler
        run: python scripts/wechat_crawler.py

      - name: Commit & Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add _posts/
          git diff --cached --quiet || git commit -m "Auto Update: WeChat digest $(date +%Y-%m-%d)"
          git push
